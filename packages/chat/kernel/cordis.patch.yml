# @dsh-chat/kernel —— L1 社区 bundle 的 loader 补丁。
#
# 见 docs/02-architecture/02-plugin-model.md §6.2：本文件中条目的书写顺序
# 不表达启动顺序。启动顺序由各插件声明的 inject 依赖推导，§6 要求的
# 「先加载身份、组织和审计，再加载消息等消费者」由此保证，不靠人工排列。
#
# 当前只装载 host。其余 P0-a 插件（identity、organization、workitem、
# messaging、notification、audit）随各自实现阶段加入；未装载的能力必须
# 显式返回 NOT_IMPLEMENTED，不得伪装为可用。
- insert:
    - id: chat-host
      # Node 可解析的包名，须与 package.json 的 name 保持一致
      name: '@dsh-chat/host'
      config: {}
